name: Bug report
description: Report a crash, missing feature behavior, or performance issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please never paste stream keys, passwords or tokens.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open RustCast
        2. Add ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RustCast version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: "Bodhi Linux 7.0 (Ubuntu 22.04 base)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste the Event log contents or `RUST_LOG=debug` output. Remove secrets.
      render: shell
