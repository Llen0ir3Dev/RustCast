name: Feature request
description: Suggest a small, concrete improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Capture
        - Audio
        - Encoding / output
        - User interface
        - Performance
        - Documentation
    validations:
      required: true
